name: metal_fx
description: Liquid metal effect for Flutter buttons, icons, text and badges.
version: 0.1.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  shaders:
    - shaders/metal.frag

